apiVersion: v1
kind: Service
metadata:
  name: coordinator-svc
spec:
  selector:
    app: coordinator
  ports:
    - name: data
      port: 9000
      targetPort: 9000
    - name: heartbeat
      port: 9002
      targetPort: 9002
  type: ClusterIP
---
# 2. DEPLOYMENT DEL COORDINADOR
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coordinator
  template:
    metadata:
      labels:
        app: coordinator
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      containers:
      - name: coordinator
        image: iot-coordinator:latest
        imagePullPolicy: Never
        command: ["/bin/sh"]
        args: ["-c", "while true; do sleep 3600; done"]
        env:
        - name: DATA_ADDR
          value: "0.0.0.0:9000"
        - name: HEARTBEAT_ADDR
          value: "0.0.0.0:9002"
        volumeMounts:
        - name: cert-volume
          mountPath: /app/certs
          readOnly: true
      volumes:
      - name: cert-volume
        hostPath:
          path: /data/iot-project/certs
---
# 3. SERVICIO DE BALANCEO PARA EDGES
apiVersion: v1
kind: Service
metadata:
  name: edge-svc
spec:
  selector:
    app: edge
  ports:
    - protocol: TCP
      port: 9001
      targetPort: 9001
---
# --- BLOQUE DE EDGES (101-102, 201-202, 301-302) ---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-101
spec:
  replicas: 1
  selector: { matchLabels: { app: edge, id: "101" } }
  template:
    metadata: { labels: { app: edge, id: "101" } }
    spec:
      containers:
      - name: edge
        image: iot-edge:latest
        imagePullPolicy: Never
        args: ["--id", "101", "--listen-addr", "0.0.0.0:9001", "--coord-addr", "coordinator-svc:9000", "--heartbeat-addr", "coordinator-svc:9002", "--cert-path", "/app/certs/edge1.crt", "--key-path", "/app/certs/edge1.key"]
        volumeMounts: [{ name: cert-volume, mountPath: /app/certs }]
      volumes: [{ name: cert-volume, hostPath: { path: /data/iot-project/certs } }]
